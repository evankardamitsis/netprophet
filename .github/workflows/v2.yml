name: v2

on:
  pull_request:
    branches: [v2, 'v2-**']
  push:
    branches: [v2, 'v2-**']

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

env:
  # v2 packages and apps only. Legacy apps/web, apps/mobile, packages/lib are not checked here.
  V2_FILTERS: >-
    --filter @netprophet/core
    --filter @netprophet/copy
    --filter @netprophet/tokens
    --filter @netprophet/db

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (v2 packages only)
        run: pnpm install --frozen-lockfile ${V2_FILTERS}
      - name: Lint
        run: pnpm ${V2_FILTERS} lint
      - name: Type-check
        run: pnpm ${V2_FILTERS} type-check
      - name: Test
        run: pnpm ${V2_FILTERS} test

  db:
    # Applies supabase-v2/migrations to a fresh PostgreSQL 17 + pgTAP (built from supabase-v2/tests/Dockerfile),
    # loads seed.sql, runs supabase-v2/tests/*.test.sql, and checks packages/db/src/types.ts is not stale.
    # The same script runs locally: see supabase-v2/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Database checks (migrations, seed, pgTAP, generated types)
        run: V2_DB_MODE=docker ./scripts/v2-db-test.sh
